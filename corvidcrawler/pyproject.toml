[project]
name = "corvidcrawler"
version = "0.2.0"
description = "Fetch corvid recordings from Xeno-canto and the Macaulay Library into the CrowGPT corpus"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "requests>=2.32",
    "python-dotenv>=1.0",
]

[project.scripts]
corvidcrawler = "corvidcrawler.cli:main"

[dependency-groups]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/corvidcrawler"]

[tool.pytest.ini_options]
testpaths = ["tests"]
