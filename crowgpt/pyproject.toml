[project]
name = "crowgpt"
version = "0.1.0"
description = "Generating crow calls from the CrowGPT corpus"
requires-python = ">=3.10,<3.11"

# numpy is pinned below 2 because birdnetlib/tflite_runtime need it, and torch
# 2.8 is happy either side of that line. Every stage runs in this one venv so
# that extraction (BirdNET) and training (torch) never have to hand off through
# a second interpreter.
dependencies = [
    "numpy<2",
    "scipy>=1.15",
    "soundfile>=0.13",
    "librosa>=0.10",
    "torch>=2.8",
    "torchaudio>=2.8",
    "transformers>=4.53",
    "birdnetlib>=0.18",
    "tflite-runtime>=2.14",
    "resampy>=0.4",
    "descript-audio-codec>=1.0.0",
]

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/crowgpt"]

# torch from PyPI defaults to the CUDA build that matches the wheel tag; pin the
# cu128 index explicitly so a CPU-only wheel can never be resolved silently.
[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu128" }
torchaudio = { index = "pytorch-cu128" }
