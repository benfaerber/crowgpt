# Deploy config for the public site at crowgpt.org.
#
# The name has to match the Worker the dashboard created when the site was first
# uploaded — cawtalker-promo-site — or a deploy makes a second, separate Worker
# and the custom domain keeps pointing at the old one.
#
# Cloudflare serves the built files directly. The one script, worker/geo.js,
# runs only for a path that is not a file: it answers /geo with the visitor's
# approximate location for the Scan page and hands anything else back to the
# assets, which is what serves the 404 page.
#
# Custom domains are bound to this Worker in Cloudflare, independently of
# deployments. Keep the existing Worker name when changing the public domain.
# Cloudflare Redirect Rules manage the old cawtalker.org address and the www
# and HTTP variants of crowgpt.org; they are not configured in this file.

name = "cawtalker-promo-site"
compatibility_date = "2026-08-06"
main = "worker/geo.js"

[assets]
# Built by `make build-public`, which roots the page at / rather than /promo.
# Never point this at the field server's copy — that one is built for a
# subdirectory and every asset URL would be wrong.
directory = "./dist"
binding = "ASSETS"
not_found_handling = "404-page"
